<!DOCTYPE html>
<html lang="uk">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Studio</title>
  <meta name="description" content="Event Studio — організація корпоративних заходів, днів народження та весіль «під ключ».">
  <meta name="theme-color" content="#1E152A">
  <meta property="og:title" content="Event Studio — організація корпоративних заходів">
  <meta property="og:description" content="Event Studio — організація корпоративних заходів, днів народження та весіль «під ключ».">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ikrablobster.github.io/event_studio/app/index.html">
  <meta property="og:image" content="https://ikrablobster.github.io/event_studio/app/images/header_bg.jpg">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.min.css">
</head>

<body>
  <header class="header" id="top">
    <div class="container">
      <div class="header__top">
        <a class="header__logo" href="#top" aria-label="На головну">
          <svg width="100" height="50" aria-hidden="true" focusable="false">
            <use xlink:href="images/sprite.svg#logo"></use>
          </svg>
        </a>
        <nav class="menu" aria-label="Головне меню">
          <ul class="menu__list anim-line" id="menu-list">
            <li class="menu__items"><a class="menu__link" href="#top">
                Головна
              </a></li>
            <li class="menu__items"><a class="menu__link" href="#about">
                Про нас
              </a></li>
            <li class="menu__items"><a class="menu__link" href="#services">
                Послуги
              </a></li>
            <li class="menu__items"><a class="menu__link" href="#contacts">
                Контакти
              </a></li>
          </ul>
        </nav>
        <a class="header__order-btn" href="#contacts">Замовити подію</a>
        <button class="menu__btn" type="button" aria-label="Відкрити меню" aria-expanded="false" aria-controls="menu-list">
          <span></span>
        </button>
      </div>
      <div class="header__contant anim-btn">
        <h1 class="header__title title-main">
          Організація корпоративних заходів
        </h1>
        <p class="header__text">
          МИ ВМІЄМО СТВОРЮВАТИ
          СВЯТКОВУ ТА НЕЗАБУТНЮ АТМОСФЕРУ
        </p>
        <a class="header__link" href="#contacts">
          Замовити подію
        </a>
      </div>
    </div>
  </header>
     <main class="main">
          
     </main>
<footer class="footer" id="contacts">
  <div class="container">
    <div class="footer__box">
      <a class="header__logo" href="#top" aria-label="На головну">
        <svg width="100" height="50" aria-hidden="true" focusable="false">
          <use xlink:href="images/sprite.svg#logo"></use>
        </svg>
      </a>
      <nav class="footer__menu" aria-label="Меню в підвалі">
        <ul class="footer__list anim-line">
          <li class="footer__items"><a class="footer__link" href="#top">
              Головна
            </a></li>
          <li class="footer__items"><a class="footer__link" href="#about">
              Про нас
            </a></li>
          <li class="footer__items"><a class="footer__link" href="#services">
              Послуги
            </a></li>
          <li class="footer__items"><a class="footer__link" href="#contacts">
              Контакти
            </a></li>
        </ul>
      </nav>
      <div class="social anim-svg">
        <a class="social__insta" href="#" aria-label="Instagram">
          <svg width="24" height="24" aria-hidden="true" focusable="false">
            <use xlink:href="images/sprite.svg#instagram"></use>
          </svg>
        </a>
        <a class="social__facebook" href="#" aria-label="Facebook">
          <svg width="24" height="24" aria-hidden="true" focusable="false">
            <use xlink:href="images/sprite.svg#facebook"></use>
          </svg>
        </a>
        <a class="social__telegram" href="#" aria-label="Telegram">
          <svg width="20" height="20" aria-hidden="true" focusable="false">
            <use xlink:href="images/sprite.svg#telegram"></use>
          </svg>
        </a>
      </div>
    </div>
  </div>
</footer>
<script src="js/main.min.js"></script>
</body>

</html>
