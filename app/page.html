<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Studio</title>
  <link rel="stylesheet" href="css/style.min.css">
</head>

<body>
  <header class="header">
    <div class="container">
      <div class="header__top">
        <a class="header__logo" href="#">
          <svg width="100" height="50">
            <use xlink:href="images/sprite.svg#logo"></use>
          </svg>
        </a>
        <nav class="menu">
          <ul class="menu__list">
            <li class="menu__items"><a class="menu__link" href="#">
                Головна
              </a></li>
            <li class="menu__items"><a class="menu__link" href="#">
                Про нас
              </a></li>
            <li class="menu__items">

              <div class="dropdown">
                <p class="dropdown-button">Послуги</p>
                <div class="dropdown-content">
                  <a href="#">Элемент 1</a>
                  <a href="#">Элемент 2</a>
                  <a href="#">Элемент 3</a>
                  <a href="#">Элемент 4</a>
                </div>
              </div>
            </li>
            <li class="menu__items"><a class="menu__link" href="#">
                Контакти
              </a></li>
          </ul>
        </nav>
        <button class="header__order-btn">
          <a class="header__order-link" href="#">Замовити подію</a>
        </button>
      </div>
      <div class="header__contant">
        <h1 class="header__title title-main">
          Організація корпоративних заходів
        </h1>
        <p class="header__text">
          МИ ВМІЄМО СТВОРЮВАТИ
          СВЯТКОВУ ТА НЕЗАБУТНЮ АТМОСФЕРУ
        </p>
        <a class="header__link" href="#">
          Замовити подію
        </a>
      </div>
    </div>
  </header>
     <main class="main">
          
     </main>
<footer class="footer">
  <div class="container">
    <div class="footer__box">
      <a class="header__logo" href="#">
        <svg width="100" height="50">
          <use xlink:href="images/sprite.svg#logo"></use>
        </svg>
      </a>
      <nav class="footer__menu">
        <ul class="menu__list">
          <li class="menu__items"><a class="menu__link" href="#">
              Головна
            </a></li>
          <li class="menu__items"><a class="menu__link" href="#">
              Про нас
            </a></li>
          <li class="menu__items">

            <div class="dropdown">
              <p class="dropdown-button">Послуги</p>
              <div class="dropdown-content">
                <a href="#">Элемент 1</a>
                <a href="#">Элемент 2</a>
                <a href="#">Элемент 3</a>
                <a href="#">Элемент 4</a>
              </div>
            </div>
          </li>
          <li class="menu__items"><a class="menu__link" href="#">
              Контакти
            </a></li>
        </ul>
      </nav>
      <div class="social">
        <a class="social__insta" href="#">
          <svg width="24" height="24">
            <use xlink:href="images/sprite.svg#instagram"></use>
          </svg>
        </a>
        <a class="social__facebook" href="#">
          <svg width="24" height="24">
            <use xlink:href="images/sprite.svg#facebook"></use>
          </svg>
        </a>
        <a class="social__telegram" href="#">
          <svg width="20" height="20">
            <use xlink:href="images/sprite.svg#telegram"></use>
          </svg>
        </a>
      </div>
    </div>
  </div>
</footer>
<script src="js/main.min.js"></script>
</body>

</html>
